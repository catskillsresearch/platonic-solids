automation:
  methods:
    - method: agent
      models:
        - "Google Gemini 3.8"
        - "Cursor Grok 4.6 (SpaceXAI / Cursor)"
        - "OpenAI GPT-5.6 Sol (via Cursor)"
      framework: "Cursor"
      role: >-
        Exploratory formalization, initial Lean 4 proof tactics, and
        drafting of PlatonicSolids.md. Palomar Challenge / Solution /
        comparator / formalization.yaml packaging and the Lake / arXiv
        infrastructure, singular-homology and excision investigation,
        and later expository revisions were added by agents under the
        author's direction. Generated Lean was provisional until it
        compiled under the pinned toolchain (leanprover/lean4:v4.30.0).
    - method: manual
      models: []
      role: >-
        The author chose the formalization route, reviews every
        definition and claim, and takes sole responsibility for the
        mathematical content. No large language model is listed as a
        co-author.
  notes: >-
    All named models were used as interactive coding and drafting
    assistants. None is a co-author.

review:
  status: self-assessed
  reviewers:
    - "Lars Warren Ericson"
  notes: >-
    The author directed and reviewed the development. No external
    review has been performed.

known_gaps: []

limitations:
  - >-
    The compared 3D theorems assume Euler's formula V+F=E+2 and
    regularity incidence. The development proves algebraic
    Euler–Poincaré in dimensions 2 and 3, the radial-projection
    homeomorphism, cellular Betti numbers of the tetrahedron
    surface and of the 4-simplex boundary, singular H₀ of
    Metric.sphere for n≥1, and H_*(S⁰). The pair LES and the
    Mayer–Vietoris sequence of an excisive triad are proved. It does
    not compute singular H_n(Metric.sphere) for n>0: that needs
    excision for the stereographic cover (barycentric subdivision).
  - >-
    The compared 4D theorem classifies the eleven Platonic-compatible
    Schläfli triples by the sign of Δ = det(schlafliGram). The
    development also proves PosDef ↔ IsRegular4Polytope for p,q,r ≥ 3.
    Neither statement constructs Coxeter groups, reflection
    representations, or geometric 4-polytopes.
  - >-
    Challenge.lean states the family but does not prove it; that is the
    Comparator convention, and Solution.lean / PlatonicSolids.lean
    supply the proofs.
  - >-
    The compared theorems may depend on propext, Classical.choice and
    Quot.sound through Mathlib. There is no sorry outside Challenge.lean,
    no project-defined axiom, and no native_decide in the compared proofs.

alignment:
  namespace: ""
  statements:
    - source: "Any regular convex polyhedron with χ=2 is one of the five Platonic solids (PlatonicSolids.md, §2)"
      lean: "platonic_solids_3d"
      module: "Challenge (statement), Solution / PlatonicSolids (proof)"
      status: proved

    - source: "E>0 is forced by Euler and regularity; it is not an independent axiom (PlatonicSolids.md, §2.4)"
      lean: "edges_pos_of_regular"
      module: "Challenge (statement), Solution / PlatonicSolids (proof)"
      status: proved

    - source: "Platonic cells and vertex figures with Δ>0 are exactly the six regular convex 4-polytopes (PlatonicSolids.md, §§3–4)"
      lean: "regular_polychora_classification"
      module: "Challenge (statement), Solution / PlatonicSolids (proof)"
      status: proved

    - source: "The five Platonic pairs (p,q)"
      lean: "IsPlatonicPair"
      module: "Challenge (statement), PlatonicSolids (definition)"
      status: proved

    - source: "The six regular convex 4-polytopes {p,q,r}"
      lean: "IsRegular4Polytope"
      module: "Challenge (statement), PlatonicSolids (definition)"
      status: proved

    - source: "Δ(p,q,r)=sin²(π/p)sin²(π/r)−cos²(π/q)"
      lean: "schlafliDet"
      module: "Challenge (statement), PlatonicSolids/GramMatrix (definition)"
      status: proved

    - source: "The rank-4 Schläfli Gram matrix of {p,q,r}"
      lean: "schlafliGram"
      module: "Challenge (statement), PlatonicSolids/GramMatrix (definition)"
      status: proved
