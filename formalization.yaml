    location: "3rd ed., Dover Publications, 1973"
    relationship: background
    note: >-
      Classical source of the Schläfli symbols, Coxeter diagrams, and
      the census of regular polytopes. Background only; no Lean import.

  - title: "Theorie der vielfachen Kontinuität"
    authors: ["Ludwig Schläfli"]
    type: "book"
    location: "Zürcher & Furrer, 1852"
    relationship: background

  - title: "The Thirteen Books of the Elements, Vol. 3 (Books X–XIII)"
    authors: ["Euclid"]
    type: "book"
    location: "Translated by T. L. Heath, Cambridge University Press, 1908"
    relationship: background

  - title: "Reflection Groups and Coxeter Groups"
    authors: ["J. E. Humphreys"]
    type: "book"
    location: "Cambridge Studies in Advanced Mathematics, Cambridge University Press, 1990"
    relationship: background

