version: "v0.4"

project:
  name: "From Platonic Solids to Regular 4-Polytopes"
  description: >-
    A Lean 4 / Mathlib classification of the regular convex polyhedra in
    R^3 (the five Platonic solids) and the regular convex polychora in
    R^4 (the six regular 4-polytopes). In dimension 3, the Euler
    characteristic χ(S^2)=2 together with regularity incidence yields
    (p-2)(q-2)<4 and forces E>0 without a geometric non-degeneracy
    axiom. In dimension 4, χ(S^3)=0 supplies no bound; the six spherical
    triples are those Platonic-cell / Platonic-vertex-figure combinations
    whose Schläfli Gram determinant is strictly positive. The informal
    account is the companion note PlatonicSolids.md. The Lean source was
    written by AI agents under the direction and review of the author.
    There is no sorry outside the deliberate holes in Challenge.lean, no
    project-defined axiom, and Mathlib is the only Lake dependency.
  authors:
    - "Lars Warren Ericson"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lars Warren Ericson"

repository:
  role: substantive-development

classification:
  arxiv: [math.HO, cs.LO, math.MG]
  msc2020: ["52B11", "20F55", "51M20", "68V20"]

status:
  scope: >-
    Complete, with no unproved step. Palomar Comparator selects three
    theorems: platonic_solids_3d, edges_pos_of_regular, and
    regular_polychora_classification. The 3D theorems take a polyhedron
    with p,q ≥ 3, incidence pF=2E and qV=2E, and Euler V+F=E+2. The 4D
    theorem takes Platonic cells and vertex figures together with a
    strictly positive Schläfli Gram determinant Δ, defined from
    Mathlib Real.sin and Real.cos. The same development proves the
    Gram matrix is positive definite iff the triple is one of the six.
    Nothing in the compared statement is imported from a prior Palomar
    entry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "platonic_solids_3d"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "edges_pos_of_regular"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "regular_polychora_classification"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

fidelity:
  divergences: >-
    Informal χ(S²)=2 is proved for the standard simplicial 2-sphere
    (tetrahedron surface) over ℚ as homology_sphere2. Informal
    χ(S³)=0 is proved for the standard simplicial 3-sphere
    (4-simplex boundary) over ℚ as homology_sphere3 / eulerChar_sphere3.
    Singular H₀ of Metric.sphere for n≥1 and H_*(S⁰) are proved.
    The pair and triad exact sequences of singular chains are proved;
    excision for the stereographic cover of the sphere (small simplices)
    is not, so H_n(Metric.sphere) for n>0 is not identified. The algebraic
    Euler–Poincaré identities and the radial-projection homeomorphism
    are proved. The compared 3D theorem still takes V+F=E+2 so that
    Palomar Comparator types stay combinatorial.
    The 4D compared theorem classifies Platonic-compatible triples by
    the sign of Δ = det(schlafliGram), using Mathlib Real.sin / Real.cos
    and the rank-4 Gram matrix. It does not construct geometric
    realizations or Coxeter groups as Lean objects. The stronger
    equivalence regular_polychora_iff (PosDef ↔ one of the six) is
    proved in the development but is not a compared Palomar theorem.

